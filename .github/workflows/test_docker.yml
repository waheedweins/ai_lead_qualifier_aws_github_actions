name: Build and Test Docker Locally

on:
  push:
    branches:
      - main

jobs:
  test-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ai-lead-qualifier:latest .

      - name: Run Docker Container
        run: |
          docker run -d -p 8000:8000 --name test-container ai-lead-qualifier:latest
          
      - name: Test Container Health/Endpoints
        run: |
          # Give the container a few seconds to start up
          sleep 5
          # Check if container is running
          docker ps
          # Optional: Run a curl command to test an endpoint if your app has one
          # curl --fail http://localhost:8000/ || exit 1
