name: Continuous Deployment to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Push to ECR, and Deploy to App Runner
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag, and Push Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Create or Update AWS App Runner Service
      run: |
        # 1. Check if the App Runner service already exists
        SERVICE_ARN=$(aws apprunner list-services --region ${{ secrets.AWS_REGION }} --query "ServiceSummaryList[?ServiceName=='${{ secrets.APP_RUNNER_SERVICE_NAME }}'].ServiceArn" --output text)
        
        IMAGE_URI="489205147073.dkr.ecr.eu-north-1.amazonaws.com/ai-lead-qualifier_aws_github_actions:latest"

        if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
          # --- CASE A: Service Exists -> Trigger an update deployment ---
          echo "Service found. Triggering live deployment update..."
          aws apprunner start-deployment --region ${{ secrets.AWS_REGION }} --service-arn $SERVICE_ARN
        else
          # --- CASE B: Service Does Not Exist -> Create it from scratch ---
          echo "Service not found. Automatically creating a fresh App Runner instance..."
          
          aws apprunner create-service \
            --region ${{ secrets.AWS_REGION }} \
            --service-name ${{ secrets.APP_RUNNER_SERVICE_NAME }} \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"$IMAGE_URI\",
                \"ImageConfiguration\": {
                  \"Port\": \"8000\",
                  \"RuntimeEnvironmentVariables\": [
                    {\"Name\": \"OPENAI_API_KEY\", \"Value\": \"${{ secrets.OPENAI_API_KEY }}\"}
                  ]
                },
                \"ImageRepositoryType\": \"ECR\"
              },
              \"AutoDeploymentsEnabled\": false
            }" \
            --instance-configuration "Cpu=1 vCPU,Memory=2 GB"
        fi
